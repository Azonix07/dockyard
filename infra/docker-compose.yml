# Runbase stack.
#
# Every service restarts unless explicitly stopped — without this a Docker
# Desktop restart, a WSL shutdown or an OOM kill left the whole platform down
# until someone SSH'd in, which is the single biggest cause of "my backend
# disappeared".
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: paas
      POSTGRES_PASSWORD: paas
      POSTGRES_DB: paas
      # Faster + safer defaults for a single-laptop host
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - synchronous_commit=off
      - -c
      - tcp_keepalives_idle=30
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=3
    volumes:
      - paas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paas -d paas"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - paas

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://paas:paas@postgres:5432/paas
      PORT: "8080"
      DATA_DIR: /var/lib/laptop-paas
      CADDYFILE_PATH: /etc/caddy/dynamic/Caddyfile
      DOCKER_HOST: unix:///var/run/docker.sock
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
      CADDY_ADMIN_URL: http://caddy:2019
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - paas_data:/var/lib/laptop-paas
      - caddy_dynamic:/etc/caddy/dynamic
      - ../data:/host-data:ro
    ports:
      # 8180 avoids conflict with other apps on cafe PC (e.g. Gamespot on 8080)
      - "${API_PORT:-8180}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - paas

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://paas:paas@postgres:5432/paas
      DATA_DIR: /var/lib/laptop-paas
      CADDYFILE_PATH: /etc/caddy/dynamic/Caddyfile
      DOCKER_HOST: unix:///var/run/docker.sock
      CADDY_ADMIN_URL: http://caddy:2019
      PROXY_API_UPSTREAM: api:8080
      PROXY_WEB_UPSTREAM: web:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - paas_data:/var/lib/laptop-paas
      - caddy_dynamic:/etc/caddy/dynamic
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - paas

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Runtime hint; browser defaults to same host :8180 if empty
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      # 3100 avoids conflict with other apps on cafe PC (e.g. Gamespot on 3000)
      - "${WEB_PORT:-3100}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 40s
    depends_on:
      - api
    networks:
      - paas

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /etc/caddy/dynamic/Caddyfile ]; then
          cp /init/Caddyfile.initial /etc/caddy/dynamic/Caddyfile
        fi
        # Validate before starting: a bad generated file must not take the
        # proxy down. Fall back to the known-good initial config.
        if ! caddy validate --config /etc/caddy/dynamic/Caddyfile --adapter caddyfile >/dev/null 2>&1; then
          echo "Generated Caddyfile failed validation — falling back to initial config" >&2
          cp /etc/caddy/dynamic/Caddyfile /etc/caddy/dynamic/Caddyfile.rejected || true
          cp /init/Caddyfile.initial /etc/caddy/dynamic/Caddyfile
        fi
        exec caddy run --config /etc/caddy/dynamic/Caddyfile --adapter caddyfile --watch
    volumes:
      - caddy_dynamic:/etc/caddy/dynamic
      - caddy_data:/data
      - ./Caddyfile.initial:/init/Caddyfile.initial:ro
    ports:
      - "${PROXY_PORT:-80}:80"
    expose:
      - "2019"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    stop_grace_period: 15s
    networks:
      - paas

volumes:
  paas_pg:
  paas_data:
  caddy_dynamic:
  caddy_data:

networks:
  paas:
    name: laptop-paas
    driver: bridge
